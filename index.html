<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uddipta Bhardwaj | Astrophysics Researcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
      color: white;
    }
    /* Particles.js container */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    .overlay {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 0 20px;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 300;
      max-width: 700px;
      line-height: 1.5;
    }
    nav {
      position: absolute;
      top: 20px;
      right: 30px;
    }
    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #00ffff;
    }
    footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  <nav>
    <a href="#about">About</a>
    <a href="#research">Research</a>
    <a href="#publications">Publications</a>
    <a href="#contact">Contact</a>
  </nav>
  <div class="overlay">
    <h1>Uddipta Bhardwaj</h1>
    <h2>PhD researcher at GRAPPA, University of Amsterdam | Gravitational Waves | Machine Learning | Inference</h2>
  </div>
  <footer>&copy; 2025 Uddipta Bhardwaj | Built with ❤️</footer>

  <!-- Particles.js library -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <!-- Initialize particles -->
  <script>
    particlesJS.load('particles-js', 'particles.json', function() {
      console.log('particles.js loaded - callback');
    });
  </script>
</body>
</html>
